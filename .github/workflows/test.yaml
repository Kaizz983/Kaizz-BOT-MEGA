name: Build Snap

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Model'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - 'armv64'
          - 'x86_64'
      version:
        description: 'Branch'
        required: true
        default: 'snapshot-24.10'
        type: choice
        options:
        #  - 'release'
          - 'snapshot-24.10'
      ccache:
        description: Cache
        type: boolean
        default: true
      lan_addr:
        description: 'LAN IP'
        required: true
        default: '192.168.15.1'
        type: string

jobs:
  build:
    name: Build Snap
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
    - name: Set up Git credentials
      run: |
        git config --global url."https://${{ secrets.KEY_CLASS }}@github.com/".insteadOf "https://github.com/"

    - name: Delete old runs
      env:
        GH_TOKEN: ${{ secrets.KEY_CLASS }}
      run: |
        runs=$(gh run list --repo ${{ github.repository }} --limit 100 --json databaseId,status | jq -r '.[] | select(.status != "in_progress") | .databaseId')
        for run_id in $runs; do
          echo "Deleting run ID: $run_id"
          echo y | gh run delete $run_id --repo ${{ github.repository }}
        done
